<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand-Controlled Platformer</title>
<style>
  :root { --bg:#070B0E; --surface:#0D1519; --teal:#0B5965; --accent:#00D4E8; --ice:#B9DCE5; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:14px; background:var(--bg); color:var(--ice);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:12px; }
  h1 { margin:0; font-size:1.4rem; color:var(--accent); }
  #wrap { position:relative; width:100%; max-width:800px; }
  canvas { width:100%; height:auto; background:var(--surface); border:2px solid var(--teal);
           border-radius:12px; display:block; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:12px; background:rgba(7,11,14,.88); border-radius:12px;
             text-align:center; padding:20px; }
  button { background:var(--accent); color:#04181c; border:0; border-radius:10px; padding:12px 28px;
           font-size:1rem; font-weight:700; cursor:pointer; }
  #msg { font-size:.95rem; line-height:1.7; }
  .hint { font-size:.85rem; opacity:.75; text-align:center; max-width:800px; }
</style>
</head>
<body>
<h1>Hand-Controlled Platformer</h1>
<div id="wrap">
  <canvas id="game" width="800" height="480"></canvas>
  <div id="overlay">
    <div id="msg">
      Move your hand left / right in front of the camera to run.<br>
      Close your fist to jump. Collect all the coins!
    </div>
    <button id="start">Start (allow camera)</button>
  </div>
</div>
<p class="hint">Your camera is processed locally in your browser — nothing is uploaded. Press R to restart.</p>
<video id="cam" playsinline muted style="display:none"></video>

<script type="module">
import { HandLandmarker, FilesetResolver } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const W = 800, H = 480, GRAVITY = 0.8, JUMP_V = -15, SPEED = 6, PW = 30, PH = 40;
const PLATFORMS = [[0,440,800,40],[150,350,140,15],[350,270,140,15],[560,190,140,15],[300,140,120,15]];
const COINS = [[220,320],[420,240],[630,160],[360,110]];

const cv = document.getElementById("game"), ctx = cv.getContext("2d");
const video = document.getElementById("cam");
const overlay = document.getElementById("overlay"), msg = document.getElementById("msg");
const startBtn = document.getElementById("start");

let g, landmarker, hand = null, direction = 0, fist = false;
const newGame = () => (g = { x:50, y:400, vy:0, ground:false, coins:COINS.map(c => [...c]), won:false });
newGame();

const fingers = lm => [[8,6],[12,10],[16,14],[20,18]].filter(([t,p]) => lm[t].y < lm[p].y).length;

function readHand() {
  if (!landmarker || video.readyState < 2) return;
  const res = landmarker.detectForVideo(video, performance.now());
  hand = res.landmarks[0] || null;
  if (!hand) { direction = 0; fist = false; return; }
  const x = 1 - hand[9].x;                       // mirrored, like a mirror
  direction = x < 0.4 ? -1 : x > 0.6 ? 1 : 0;
  fist = fingers(hand) <= 1;
}

function update() {
  if (g.won) return;
  g.x = Math.min(Math.max(g.x + direction * SPEED, 0), W - PW);
  if (fist && g.ground) g.vy = JUMP_V;
  const prevBottom = g.y + PH;
  g.vy += GRAVITY; g.y += g.vy; g.ground = false;
  for (const [px, py, pw] of PLATFORMS) {         // one-way platforms
    const overlap = g.x + PW > px && g.x < px + pw;
    if (overlap && g.vy >= 0 && prevBottom <= py && py <= g.y + PH) { g.y = py - PH; g.vy = 0; g.ground = true; }
  }
  g.coins = g.coins.filter(([cx, cy]) => Math.abs(cx - (g.x + PW/2)) > 25 || Math.abs(cy - (g.y + PH/2)) > 30);
  g.won = g.coins.length === 0;
}

function draw() {
  ctx.fillStyle = "#0D1519"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#0B5965";
  PLATFORMS.forEach(([x,y,w,h]) => ctx.fillRect(x, y, w, h));
  ctx.fillStyle = "#00D4E8";
  g.coins.forEach(([x,y]) => { ctx.beginPath(); ctx.arc(x, y, 10, 0, 7); ctx.fill(); });
  ctx.fillStyle = "#B9DCE5"; ctx.fillRect(g.x, g.y, PW, PH);
  ctx.fillStyle = "#070B0E"; ctx.beginPath(); ctx.arc(g.x + 22, g.y + 12, 4, 0, 7); ctx.fill();
  ctx.fillStyle = "#B9DCE5"; ctx.font = "bold 20px system-ui";
  ctx.fillText("Coins left: " + g.coins.length, 12, 28);

  // camera preview (mirrored) + hand dots + zone lines
  const cw = 200, ch = 150, cx = W - cw - 10, cy = 10;
  if (video.readyState >= 2) {
    ctx.save(); ctx.translate(cx + cw, cy); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, cw, ch); ctx.restore();
  }
  ctx.strokeStyle = "rgba(0,212,232,.7)"; ctx.lineWidth = 1;
  [0.4, 0.6].forEach(f => { ctx.beginPath(); ctx.moveTo(cx + cw*f, cy); ctx.lineTo(cx + cw*f, cy + ch); ctx.stroke(); });
  if (hand) { ctx.fillStyle = "#00D4E8";
    hand.forEach(p => { ctx.beginPath(); ctx.arc(cx + (1 - p.x) * cw, cy + p.y * ch, 2.5, 0, 7); ctx.fill(); }); }
  ctx.strokeStyle = "#0B5965"; ctx.strokeRect(cx, cy, cw, ch);

  if (g.won) {
    ctx.fillStyle = "#00D4E8"; ctx.font = "bold 44px system-ui"; ctx.textAlign = "center";
    ctx.fillText("YOU WIN!  Press R", W/2, H/2); ctx.textAlign = "start";
  }
}

let last = 0, acc = 0;
function loop(t) {
  acc += Math.min(t - last, 100); last = t;
  readHand();
  while (acc >= 1000/60) { update(); acc -= 1000/60; }   // fixed 60 steps/sec on any screen
  draw();
  requestAnimationFrame(loop);
}

startBtn.onclick = async () => {
  startBtn.disabled = true; startBtn.textContent = "Loading…";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    video.srcObject = stream; await video.play();
    const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
      runningMode: "VIDEO", numHands: 1
    });
    overlay.style.display = "none";
    requestAnimationFrame(t => { last = t; loop(t); });
  } catch (e) {
    msg.textContent = "Couldn't start the camera or model: " + e.message;
    startBtn.disabled = false; startBtn.textContent = "Try again";
  }
};
addEventListener("keydown", e => { if (e.key.toLowerCase() === "r") newGame(); });
draw();
</script>
</body>
</html>
